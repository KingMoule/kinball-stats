# Déploiement du site statique (racine du dépôt) sur GitHub Pages.
name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploiement:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      # Le déploiement échoue si la version ou l'empreinte de sw.js / kbsite.js ne correspondent pas aux fichiers
      # (oubli de « node outils/check-release.mjs --ecrire » : les appareils ne verraient jamais la mise à jour).
      - name: Vérifier la cohérence version et empreinte
        run: node outils/check-release.mjs
      - name: Configurer Pages (activation automatique)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Envoyer la racine comme artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Déployer
        id: deploiement
        uses: actions/deploy-pages@v4
